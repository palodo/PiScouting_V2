# Despliegue en una VM (Azure/DigitalOcean/etc.): backend + Caddy (HTTPS automático).
# La BBDD SQLite vive en el volumen 'piscouting_data' (persistente en el disco de la VM).
# Variables en un fichero .env junto a este (ver .env.example).
services:
  app:
    build: .
    restart: unless-stopped
    environment:
      - PISCOUTING_DB_PATH=/data/scouting.db
      - PISCOUTING_SECRET=${PISCOUTING_SECRET}
      - PISCOUTING_ADMIN_TOKEN=${PISCOUTING_ADMIN_TOKEN}
      - FRONTEND_ORIGIN=${FRONTEND_ORIGIN}
      # ID de cliente de Google (público: viaja en el propio botón de la web)
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      # Correo saliente (recuperar contraseña). Sin esto, el reseteo sigue funcionando
      # con el enlace que genera el administrador desde la app.
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - SMTP_FROM=${SMTP_FROM}
      - APP_URL=${APP_URL}
      # Notificaciones push. Se generan UNA vez en el servidor (ver DEPLOY_AZURE.md);
      # sin ellas la app funciona igual, solo que sin avisos en el móvil.
      - VAPID_PUBLIC_KEY=${VAPID_PUBLIC_KEY}
      - VAPID_PRIVATE_KEY=${VAPID_PRIVATE_KEY}
      - VAPID_SUBJECT=${VAPID_SUBJECT}
    volumes:
      - piscouting_data:/data
    ports:
      - "127.0.0.1:8080:8080"   # solo local (para el cron); el acceso público va por Caddy
    expose:
      - "8080"

  caddy:
    build: ./fantasy-web   # construye la web del FANTASY y la sirve; proxy de /api al backend
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN=${DOMAIN}
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  piscouting_data:
  caddy_data:
  caddy_config:
